<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website discovery brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F1626;
    --ink-soft:#4A3F58;
    --paper:#FAF6EF;
    --paper-soft:#F1E9D8;
    --amber:#E8A33D;
    --amber-deep:#B9791F;
    --violet:#7C63B8;
    --violet-deep:#584388;
    --line:#E1D6C2;
    --line-dark:#382C46;
    --success:#2E9E76;
    --danger:#C25450;
    --radius:14px;
    --serif:'Fraunces',serif;
    --sans:'Inter',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);}
  .app{display:flex;min-height:100vh;}

  /* ---------- rail ---------- */
  .rail{
    width:280px;flex-shrink:0;background:var(--ink);color:var(--paper);
    padding:32px 24px;display:flex;flex-direction:column;gap:32px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;flex-direction:column;gap:4px;}
  .brand .mark{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber);}

  .eq{display:flex;gap:3px;align-items:flex-end;height:28px;}
  .eq-bar{flex:1;background:var(--line-dark);border-radius:2px;transition:background .3s ease,height .3s ease;}
  .eq-bar.done{background:var(--amber);}
  .eq-bar.current{background:var(--violet);}
  @media (prefers-reduced-motion: no-preference){
    .eq-bar.current{animation:pulse 1.6s ease-in-out infinite;}
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

  .steps{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0;font-size:13px;}
  .steps li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-soft);cursor:default;}
  .steps li .dot{width:6px;height:6px;border-radius:50%;background:var(--line-dark);flex-shrink:0;}
  .steps li.done{color:var(--paper);}
  .steps li.done .dot{background:var(--amber);}
  .steps li.active{background:rgba(255,255,255,0.07);color:var(--paper);font-weight:500;}
  .steps li.active .dot{background:var(--violet);}

  .rail-foot{margin-top:auto;font-size:11px;color:var(--ink-soft);font-family:var(--mono);cursor:pointer;border-top:1px solid var(--line-dark);padding-top:16px;}
  .rail-foot:hover{color:var(--amber);}

  /* ---------- main ---------- */
  .panel{flex:1;display:flex;justify-content:center;padding:56px 32px 100px;}
  .panel-inner{width:100%;max-width:640px;}

  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--violet-deep);margin:0 0 10px;}
  h1.step-title{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.15;margin:0 0 12px;letter-spacing:-0.01em;}
  p.step-desc{font-size:15px;color:var(--ink-soft);line-height:1.6;margin:0 0 32px;max-width:52ch;}

  label.field-label{display:block;font-size:13px;font-weight:600;margin:0 0 8px;color:var(--ink);}
  .hint{font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;}

  input[type=text],input[type=email],input[type=date],textarea,select{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:11px 14px;margin-bottom:22px;transition:border-color .15s ease;
  }
  textarea{resize:vertical;min-height:88px;line-height:1.5;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,99,184,0.15);}
  input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--violet);outline-offset:1px;}

  .field-group{margin-bottom:22px;}

  /* card grid choices */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .choice-card{
    border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease,transform .1s ease;
    text-align:left;font-family:var(--sans);
  }
  .choice-card:hover{border-color:var(--violet);}
  .choice-card:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
  .choice-card.selected{border-color:var(--violet);background:#F6F3FB;box-shadow:0 0 0 1px var(--violet);}
  .choice-card .cc-title{font-weight:600;font-size:14px;color:var(--ink);}
  .choice-card .cc-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;}
  .choice-card .cc-swatches{display:flex;gap:5px;}
  .choice-card .cc-swatches span{width:22px;height:22px;border-radius:6px;display:inline-block;border:1px solid rgba(0,0,0,0.06);}
  .choice-card .cc-pattern{height:52px;border-radius:8px;border:1px solid var(--line);}
  .choice-card .cc-check{position:absolute;}

  /* chips */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .chip{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;
    font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);transition:all .15s ease;
  }
  .chip:hover{border-color:var(--violet);}
  .chip.selected{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .chip.selected.amber{background:var(--amber-deep);border-color:var(--amber-deep);}

  /* font pair preview */
  .font-card .fc-display{font-size:20px;line-height:1.2;margin-bottom:2px;color:var(--ink);}
  .font-card .fc-body{font-size:12px;color:var(--ink-soft);}

  /* radio row (simple) */
  .radio-row{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
  .radio-opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;}
  .radio-opt.selected{border-color:var(--violet);background:#F6F3FB;}
  .radio-opt input{margin-top:2px;accent-color:var(--violet);width:auto;margin-bottom:0;flex-shrink:0;}
  .radio-opt .ro-text b{display:block;font-size:14px;color:var(--ink);}
  .radio-opt .ro-text span{font-size:12px;color:var(--ink-soft);}

  /* services / repeatable rows */
  .service-row{border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff;position:relative;}
  .service-row input,.service-row textarea{margin-bottom:0;}
  .service-row .srow-remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;}
  .service-row .srow-remove:hover{color:var(--danger);}
  .add-btn{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:12px;width:100%;color:var(--ink-soft);font-family:var(--sans);font-size:13px;cursor:pointer;margin-bottom:22px;}
  .add-btn:hover{border-color:var(--violet);color:var(--violet-deep);}

  /* tag input for categories */
  .tag-input-row{display:flex;gap:8px;margin-bottom:10px;}
  .tag-input-row input{margin-bottom:0;flex:1;}
  .tag-input-row button{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:0 16px;cursor:pointer;font-size:13px;}
  .tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .tag-pill{background:var(--paper-soft);border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 14px;font-size:12px;display:flex;align-items:center;gap:8px;}
  .tag-pill button{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:14px;}

  /* slider */
  .range-wrap{margin-bottom:26px;}
  input[type=range]{width:100%;accent-color:var(--violet);margin:10px 0 6px;}
  .range-out{font-family:var(--mono);font-size:13px;color:var(--violet-deep);font-weight:500;}

  /* nav buttons */
  .nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-top:36px;max-width:640px;}
  .btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:12px 26px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-primary:hover{background:#332545;}
  .btn-ghost{background:none;border-color:var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}

  .error-text{color:var(--danger);font-size:12px;margin:-14px 0 16px;}

  /* review */
  .review-block{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .review-block h3{font-family:var(--serif);font-size:15px;margin:0 0 10px;color:var(--ink);}
  .review-row{display:flex;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--paper-soft);}
  .review-row:first-of-type{border-top:none;}
  .review-row .rk{color:var(--ink-soft);min-width:170px;flex-shrink:0;}
  .review-row .rv{color:var(--ink);font-weight:500;}

  .done-screen{text-align:center;padding:60px 0;}
  .done-screen .icon{width:56px;height:56px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px;}

  .admin-panel{position:fixed;inset:0;background:rgba(31,22,38,0.6);display:flex;align-items:center;justify-content:center;padding:32px;z-index:50;}
  .admin-box{background:var(--paper);border-radius:16px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto;padding:28px;}
  .admin-box h2{font-family:var(--serif);margin-top:0;}
  .admin-entry{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13px;}
  .admin-entry pre{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;margin:8px 0 0;color:var(--ink-soft);}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .rail{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:18px 20px;gap:16px;}
    .rail .steps{display:none;}
    .brand{flex-shrink:0;}
    .rail-foot{display:none;}
    .eq{flex:1;}
    .panel{padding:32px 20px 80px;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">Discovery Brief</div>
      <div class="sub" id="stepCounter">Step 1 of 13</div>
    </div>
    <div class="eq" id="eq"></div>
    <ul class="steps" id="stepsNav"></ul>
    <div class="rail-foot" id="adminLink">View submitted responses ↗</div>
  </aside>

  <main class="panel">
    <div class="panel-inner">
      <div id="content"></div>
      <div class="nav-buttons" id="navButtons"></div>
    </div>
  </main>
</div>

<div class="admin-panel" id="adminPanel" style="display:none;">
  <div class="admin-box">
    <h2>Submitted responses</h2>
    <div id="adminList"></div>
    <button class="btn btn-ghost" id="closeAdmin" style="margin-top:12px;">Close</button>
  </div>
</div>

<script>
const PALETTES = [
  {name:'Amber signal', colors:['#1F1626','#7C63B8','#E8A33D','#FAF6EF']},
  {name:'Coral pulse', colors:['#101820','#FF6B5B','#FFD166','#F4F1EA']},
  {name:'Emerald data', colors:['#0B2B26','#2ED9A6','#F4C95D','#F7F5F0']},
  {name:'Midnight neon', colors:['#0D0F1A','#5CE1E6','#FF3EA5','#EDEDED']},
  {name:'Clay and ink', colors:['#2B2118','#C9622A','#8C7A5B','#F3ECE1']},
  {name:'Rose quartz', colors:['#241B2F','#E38AAE','#F2C879','#FBF7F4']}
];
const AVOID_CHIPS = ['Black','Neon green','Pastel pink','Bright orange','Grey / beige','Red'];

const VIBES = [
  {name:'Minimal and clean', desc:'Lots of white space, quiet typography'},
  {name:'Bold and colorful', desc:'High contrast, playful, energetic'},
  {name:'Corporate and professional', desc:'Trustworthy, structured, polished'},
  {name:'Warm and personal', desc:'Approachable, story-led, human'},
  {name:'Edgy and modern', desc:'Unexpected layouts, sharp contrast'},
  {name:'Luxury and premium', desc:'Refined, spacious, high-end feel'}
];

const PATTERNS = [
  {name:'Dot grid', css:'radial-gradient(circle, rgba(31,22,38,0.55) 1.6px, transparent 1.6px)', size:'14px 14px'},
  {name:'Diagonal lines', css:'repeating-linear-gradient(45deg, rgba(31,22,38,0.5) 0px, rgba(31,22,38,0.5) 2px, transparent 2px, transparent 10px)'},
  {name:'Grid', css:'linear-gradient(rgba(31,22,38,0.45) 1px, transparent 1px), linear-gradient(90deg, rgba(31,22,38,0.45) 1px, transparent 1px)', size:'16px 16px'},
  {name:'Checks', css:'conic-gradient(rgba(31,22,38,0.45) 90deg, transparent 90deg 180deg, rgba(31,22,38,0.45) 180deg 270deg, transparent 270deg)', size:'16px 16px'},
  {name:'Waves', css:'radial-gradient(circle at 0 50%, transparent 40%, rgba(31,22,38,0.45) 41%, rgba(31,22,38,0.45) 44%, transparent 45%), radial-gradient(circle at 100% 50%, transparent 40%, rgba(31,22,38,0.45) 41%, rgba(31,22,38,0.45) 44%, transparent 45%)', size:'24px 20px'},
  {name:'Scatter', css:'radial-gradient(circle, rgba(31,22,38,0.55) 2px, transparent 2px)', size:'22px 18px, 30px 26px'}
];

const FONT_PAIRS = [
  {name:'Editorial serif', display:"'Fraunces', serif", body:"'Inter', sans-serif", sample:'Aa'},
  {name:'Modern grotesk', display:"'Space Grotesk', sans-serif", body:"'Inter', sans-serif", sample:'Aa'},
  {name:'Classic elegant', display:"'Playfair Display', serif", body:"'Source Sans Pro', sans-serif", sample:'Aa'},
  {name:'Techy mono', display:"'Space Grotesk', sans-serif", body:"'IBM Plex Mono', monospace", sample:'Aa'},
  {name:'Friendly rounded', display:"'Poppins', sans-serif", body:"'Nunito Sans', sans-serif", sample:'Aa'}
];

let state = {
  clientName:'', projectNickname:'',
  businessDesc:'', audience:'', primaryGoal:'', goalOther:'',
  inspirationLinks:'', avoidNotes:'',
  selectedPalette:null, avoidColorChips:[],
  selectedVibe:null, selectedPattern:null,
  selectedFontPair:null,
  hasPhotos:null,
  homeSections:[], ctaText:'', homeMessage:'',
  services:[{name:'',desc:''}], showPricing:null, bookingMethod:null,
  coursesStatus:null, coursesHosting:null, paymentMethods:[], numCourses:'',
  blogPlatforms:[], blogFreq:null, blogCategories:[], blogManage:null,
  chatType:null, chatFaqs:'',
  domain:'', hosting:null, selfEdit:null, integrations:[], seoAnalytics:[], launchDate:'', budget:1, contentReady:null,
  finalNotes:''
};

let currentStep = 0;
let newTagBuffer = '';

const HOME_SECTIONS = ['Hero intro','About snippet','Services preview','Testimonials','Featured blog posts','Course promo','Email signup'];
const GOALS = [
  {v:'booked', t:'Get booked for client work'},
  {v:'sell', t:'Sell courses'},
  {v:'list', t:'Build an email list'},
  {v:'authority', t:'Establish authority / personal brand'},
  {v:'other', t:'Something else'}
];
const PAYMENT_METHODS = ['Stripe','PayPal','Bank transfer','Not sure yet'];
const BLOG_PLATFORMS = ['LinkedIn','Substack','Medium','Instagram','None yet'];
const INTEGRATIONS = ['Mailchimp','ConvertKit','Other email tool','Calendly booking','CRM'];
const SEO_ANALYTICS = ['Google Analytics','SEO plugin (Yoast/RankMath)','Meta / social pixel','Not sure, recommend one'];
const BUDGET_LABELS = ['Under $1,000','$1,000 - $3,000','$3,000 - $5,000','$5,000 - $10,000','$10,000+'];

const STEPS = [
  {id:'welcome', label:'Welcome'},
  {id:'about', label:'About & goals'},
  {id:'colors', label:'Color palette'},
  {id:'vibe', label:'Vibe & pattern'},
  {id:'type', label:'Typography'},
  {id:'home', label:'Home page'},
  {id:'services', label:'Services'},
  {id:'courses', label:'Courses'},
  {id:'blog', label:'Blog'},
  {id:'chat', label:'Chat widget'},
  {id:'tech', label:'Technical'},
  {id:'notes', label:'Final notes'},
  {id:'review', label:'Review & submit'}
];

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

function renderRail(){
  const eq = document.getElementById('eq');
  eq.innerHTML = STEPS.map((s,i)=>{
    const cls = i<currentStep?'done':(i===currentStep?'current':'');
    const h = 8 + (i<=currentStep? (i%4)*4 : 0);
    return `<div class="eq-bar ${cls}" style="height:${i<=currentStep?24:12}px"></div>`;
  }).join('');
  const nav = document.getElementById('stepsNav');
  nav.innerHTML = STEPS.map((s,i)=>{
    const cls = i<currentStep?'done':(i===currentStep?'active':'');
    return `<li class="${cls}"><span class="dot"></span>${s.label}</li>`;
  }).join('');
  document.getElementById('stepCounter').textContent = `Step ${currentStep+1} of ${STEPS.length}`;
}

function toggleArr(arr, val){
  const idx = arr.indexOf(val);
  if(idx>-1) arr.splice(idx,1); else arr.push(val);
}

function renderStep(){
  const c = document.getElementById('content');
  const id = STEPS[currentStep].id;
  let html = '';

  if(id==='welcome'){
    html = `
      <p class="eyebrow">Before we design anything</p>
      <h1 class="step-title">Let's get to know your brand.</h1>
      <p class="step-desc">This brief takes about 10 minutes. Your answers shape everything from color choices to page structure &mdash; there are no wrong answers, and "not sure, up to you" is always fine.</p>
      <label class="field-label">Your name</label>
      <input type="text" id="clientName" value="${state.clientName}" placeholder="Jane Doe">
      <label class="field-label">Project nickname <span style="font-weight:400;color:var(--ink-soft);">(optional, for our reference)</span></label>
      <input type="text" id="projectNickname" value="${state.projectNickname}" placeholder="e.g. Jane's personal site">
    `;
  }

  else if(id==='about'){
    html = `
      <p class="eyebrow">Section 1</p>
      <h1 class="step-title">About you and your goals</h1>
      <p class="step-desc">Help us understand who you are and what this site needs to do for you.</p>
      <label class="field-label">Describe yourself and your work in a sentence or two</label>
      <textarea id="businessDesc" placeholder="e.g. I help brands grow using AI-driven social media strategy.">${state.businessDesc}</textarea>
      <label class="field-label">Who is your ideal client or audience?</label>
      <textarea id="audience" placeholder="e.g. small business owners, marketing teams, other creators">${state.audience}</textarea>
      <label class="field-label">What's the number one goal for this site?</label>
      <div class="card-grid">
        ${GOALS.map(g=>`<button type="button" class="choice-card ${state.primaryGoal===g.v?'selected':''}" data-action="setGoal" data-val="${g.v}"><span class="cc-title">${g.t}</span></button>`).join('')}
      </div>
      ${state.primaryGoal==='other'?`<input type="text" id="goalOther" value="${state.goalOther}" placeholder="Tell us more">`:''}
      <label class="field-label">Sites or creators you admire <span style="font-weight:400;color:var(--ink-soft);">(share links, one per line)</span></label>
      <textarea id="inspirationLinks" placeholder="https://...">${state.inspirationLinks}</textarea>
      <label class="field-label">Anything you specifically want to avoid?</label>
      <textarea id="avoidNotes" placeholder="Style, tone, or features to steer clear of">${state.avoidNotes}</textarea>
    `;
  }

  else if(id==='colors'){
    html = `
      <p class="eyebrow">Section 2</p>
      <h1 class="step-title">Pick a color direction</h1>
      <p class="step-desc">Tap the palette that feels most like you. We'll refine the exact shades together later.</p>
      <div class="card-grid">
        ${PALETTES.map((p,i)=>`
          <button type="button" class="choice-card ${state.selectedPalette===i?'selected':''}" data-action="setPalette" data-val="${i}">
            <div class="cc-swatches">${p.colors.map(c=>`<span style="background:${c}"></span>`).join('')}</div>
            <span class="cc-title">${p.name}</span>
          </button>`).join('')}
      </div>
      <label class="field-label">Colors to avoid</label>
      <div class="chip-row">
        ${AVOID_CHIPS.map(a=>`<button type="button" class="chip ${state.avoidColorChips.includes(a)?'selected':''}" data-action="toggleAvoidColor" data-val="${a}">${a}</button>`).join('')}
      </div>
    `;
  }

  else if(id==='vibe'){
    html = `
      <p class="eyebrow">Section 2, continued</p>
      <h1 class="step-title">What's the overall feel?</h1>
      <p class="step-desc">Choose the vibe that matches your brand, then a texture that could show up as a subtle background detail.</p>
      <label class="field-label">Vibe</label>
      <div class="card-grid">
        ${VIBES.map((v,i)=>`
          <button type="button" class="choice-card ${state.selectedVibe===i?'selected':''}" data-action="setVibe" data-val="${i}">
            <span class="cc-title">${v.name}</span>
            <span class="cc-desc">${v.desc}</span>
          </button>`).join('')}
      </div>
      <label class="field-label">Texture / pattern</label>
      <div class="card-grid">
        ${PATTERNS.map((p,i)=>`
          <button type="button" class="choice-card ${state.selectedPattern===i?'selected':''}" data-action="setPattern" data-val="${i}">
            <div class="cc-pattern" style="background-image:${p.css};background-size:${p.size||'auto'};background-color:#fff;"></div>
            <span class="cc-title">${p.name}</span>
          </button>`).join('')}
      </div>
    `;
  }

  else if(id==='type'){
    html = `
      <p class="eyebrow">Section 2, continued</p>
      <h1 class="step-title">Typography pairing</h1>

  else if(id==='home'){

      <label class="field-label">Categories or tags</label>

      <div class="tag-list">
        ${state.blogCategories.map((t,i)=>`<span class="tag-pill">${t}<button type="button" data-action="removeTag" data-val="${i}">&times;</button></span>`).join('')}

      <div class="radio-row">
        <label class="radio-opt ${state.blogManage==='self'?'selected':''}"><input type="radio" name="blogManage" value="self" ${state.blogManage==='self'?'checked':''}><span class="ro-text"><b>I'll write and publish myself</b></span></label>
        <label class="radio-opt ${state.blogManage==='team'?'selected':''}"><input type="radio" name="blogManage" value="team" ${state.blogManage==='team'?'checked':''}><span class="ro-text"><b>I'll send content for you to upload</b></span></label>
      </div>
    `;
  }

  else if(id==='chat'){
    html = `
      <p class="eyebrow">Section 7</p>
      <h1 class="step-title">Chat widget</h1>
      <p class="step-desc">What should visitors experience when they click chat?</p>
      <div class="card-grid">
        <button type="button" class="choice-card ${state.chatType==='live'?'selected':''}" data-action="setChatType" data-val="live"><span class="cc-title">Live chat</span><span class="cc-desc">You or your team respond directly</span></button>
        <button type="button" class="choice-card ${state.chatType==='ai'?'selected':''}" data-action="setChatType" data-val="ai"><span class="cc-title">AI chatbot</span><span class="cc-desc">Answers FAQs about services and courses automatically</span></button>

      </div>
      ${state.chatType==='ai'?`<label class="field-label">Common questions the bot should be able to answer</label><textarea id="chatFaqs" placeholder="One per line">${state.chatFaqs}</textarea>`:''}

  }

  else if(id==='tech'){
    html = `
      <p class="eyebrow">Section 8</p>
      <h1 class="step-title">Technical and logistics</h1>
      <label class="field-label">Domain name</label>
      <input type="text" id="domain" value="${state.domain}" placeholder="e.g. janedoe.com">
      <label class="field-label">Hosting</label>
      <div class="radio-row">
        <label class="radio-opt ${state.hosting==='have'?'selected':''}"><input type="radio" name="hosting" value="have" ${state.hosting==='have'?'checked':''}><span class="ro-text"><b>I already have hosting</b></span></label>
        <label class="radio-opt ${state.hosting==='need'?'selected':''}"><input type="radio" name="hosting" value="need" ${state.hosting==='need'?'checked':''}><span class="ro-text"><b>I need help setting it up</b></span></label>
      </div>
      <label class="field-label">Do you want to edit the site yourself after launch?</label>
      <div class="radio-row">
        <label class="radio-opt ${state.selfEdit==='yes'?'selected':''}"><input type="radio" name="selfEdit" value="yes" ${state.selfEdit==='yes'?'checked':''}><span class="ro-text"><b>Yes, I want to make edits myself</b></span></label>
        <label class="radio-opt ${state.selfEdit==='no'?'selected':''}"><input type="radio" name="selfEdit" value="no" ${state.selfEdit==='no'?'checked':''}><span class="ro-text"><b>No, I'll rely on you for updates</b></span></label>
      </div>
      <label class="field-label">Integrations needed</label>
      <div class="chip-row">
        ${INTEGRATIONS.map(i=>`<button type="button" class="chip amber ${state.integrations.includes(i)?'selected':''}" data-action="toggleIntegration" data-val="${i}">${i}</button>`).join('')}
      </div>
      <label class="field-label">SEO and analytics</label>
      <div class="chip-row">
        ${SEO_ANALYTICS.map(i=>`<button type="button" class="chip amber ${state.seoAnalytics.includes(i)?'selected':''}" data-action="toggleSeo" data-val="${i}">${i}</button>`).join('')}
      </div>
      <label class="field-label">Target launch date</label>
      <input type="date" id="launchDate" value="${state.launchDate}">
      <div class="range-wrap">
        <label class="field-label">Budget range</label>
        <input type="range" id="budgetRange" min="0" max="4" step="1" value="${state.budget}">
        <div class="range-out">${BUDGET_LABELS[state.budget]}</div>
      </div>
      <label class="field-label">Is your content (bio, service copy) ready?</label>
      <div class="radio-row">
        <label class="radio-opt ${state.contentReady==='yes'?'selected':''}"><input type="radio" name="contentReady" value="yes" ${state.contentReady==='yes'?'checked':''}><span class="ro-text"><b>Yes, it's ready to go</b></span></label>
        <label class="radio-opt ${state.contentReady==='help'?'selected':''}"><input type="radio" name="contentReady" value="help" ${state.contentReady==='help'?'checked':''}><span class="ro-text"><b>I need copywriting help</b></span></label>
      </div>

  else if(id==='notes'){
    html = `
      <p class="eyebrow">Almost done</p>
      <h1 class="step-title">Anything else?</h1>
      <p class="step-desc">Last chance to tell us about must-haves, inspirations, or concerns.</p>

  else if(id==='review'){

    const pattern = state.selectedPattern!==null? PATTERNS[state.selectedPattern].name : 'Not selected';
    const font = state.selectedFontPair!==null? FONT_PAIRS[state.selectedFontPair].name : 'Not selected';

      <p class="eyebrow">Final step</p>

        <div class="review-row"><span class="rk">Name</span><span class="rv">${state.clientName||'—'}</span></div>
        <div class="review-row"><span class="rk">Business description</span><span class="rv">${state.businessDesc||'—'}</span></div>

      </div>
      <div class="review-block"><h3>Brand direction</h3>
        <div class="review-row"><span class="rk">Palette</span><span class="rv">${palette}</span></div>
        <div class="review-row"><span class="rk">Vibe</span><span class="rv">${vibe}</span></div>
        <div class="review-row"><span class="rk">Pattern</span><span class="rv">${pattern}</span></div>
        <div class="review-row"><span class="rk">Typography</span><span class="rv">${font}</span></div>
      </div>
      <div class="review-block"><h3>Pages</h3>
        <div class="review-row"><span class="rk">Home sections</span><span class="rv">${state.homeSections.join(', ')||'—'}</span></div>
        <div class="review-row"><span class="rk">Services listed</span><span class="rv">${state.services.filter(s=>s.name).length}</span></div>
        <div class="review-row"><span class="rk">Courses hosting</span><span class="rv">${state.coursesHosting||'—'}</span></div>

  c.innerHTML = html;
  attachStepEvents(id);
  renderNav();

}

function renderNav(){
  const nav = document.getElementById('navButtons');
  const isFirst = currentStep===0;
  const isLast = currentStep===STEPS.length-1;
  nav.innerHTML = `
    ${isFirst?'<span></span>':'<button class="btn btn-ghost" id="backBtn">Back</button>'}
    <button class="btn btn-primary" id="nextBtn">${isLast?'Submit brief':'Continue'}</button>
  `;
  if(!isFirst) document.getElementById('backBtn').onclick = ()=>{currentStep--; renderStep(); window.scrollTo(0,0);};
  document.getElementById('nextBtn').onclick = ()=>{
    if(isLast){ submitBrief(); return; }
    if(currentStep===0 && !state.clientName.trim()){
      showError('clientName','Enter your name to continue');
      return;
    }
    currentStep++; renderStep(); window.scrollTo(0,0);
  };
}

function showError(fieldId, msg){
  const field = document.getElementById(fieldId);
  if(!field) return;
  const existing = field.parentElement.querySelector('.error-text');
  if(existing) return;
  const e = el(`<div class="error-text">${msg}</div>`);
  field.insertAdjacentElement('afterend', e);
  field.focus();
}

function attachStepEvents(id){
  const c = document.getElementById('content');

  c.querySelectorAll('input[type=text], input[type=email], input[type=date], textarea, select').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const errT = inp.parentElement.querySelector('.error-text');
      if(errT) errT.remove();
      const key = inp.id;
      if(key && key in state){ state[key] = inp.value; saveDraft(); }
    });
  });

  c.querySelectorAll('input[type=radio]').forEach(r=>{
    r.addEventListener('change', ()=>{ state[r.name] = r.value; renderStep(); });
  });

  c.querySelectorAll('[data-action]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const action = node.dataset.action;
      const val = node.dataset.val;
      if(action==='setGoal'){ state.primaryGoal = val; }
      else if(action==='setPalette'){ state.selectedPalette = parseInt(val); }
      else if(action==='toggleAvoidColor'){ toggleArr(state.avoidColorChips, val); }
      else if(action==='setVibe'){ state.selectedVibe = parseInt(val); }
      else if(action==='setPattern'){ state.selectedPattern = parseInt(val); }
      else if(action==='setFont'){ state.selectedFontPair = parseInt(val); }
      else if(action==='toggleHomeSection'){ toggleArr(state.homeSections, val); }
      else if(action==='togglePayment'){ toggleArr(state.paymentMethods, val); }
      else if(action==='toggleBlogPlatform'){ toggleArr(state.blogPlatforms, val); }
      else if(action==='toggleIntegration'){ toggleArr(state.integrations, val); }
      else if(action==='toggleSeo'){ toggleArr(state.seoAnalytics, val); }
      else if(action==='setCoursesHosting'){ state.coursesHosting = val; }
      else if(action==='setChatType'){ state.chatType = val; }
      else if(action==='serviceName'){ state.services[parseInt(val)].name = node.value; }
      else if(action==='serviceDesc'){ state.services[parseInt(val)].desc = node.value; }
      else if(action==='removeService'){ state.services.splice(parseInt(val),1); }
      else if(action==='removeTag'){ state.blogCategories.splice(parseInt(val),1); }
      renderStep();
    });
  });

  c.querySelectorAll('[data-action=serviceName], [data-action=serviceDesc]').forEach(node=>{
    node.removeEventListener('click', ()=>{});
    node.addEventListener('input', ()=>{
      const val = node.dataset.val;
      if(node.dataset.action==='serviceName') state.services[parseInt(val)].name = node.value;
      else state.services[parseInt(val)].desc = node.value;
      saveDraft();
    });
  });

  const addServiceBtn = document.getElementById('addService');
  if(addServiceBtn) addServiceBtn.addEventListener('click', ()=>{ state.services.push({name:'',desc:''}); renderStep(); });

  const budgetRange = document.getElementById('budgetRange');
  if(budgetRange) budgetRange.addEventListener('input', ()=>{ state.budget = parseInt(budgetRange.value); renderStep(); });

  const blogFreqSel = document.getElementById('blogFreq');
  if(blogFreqSel) blogFreqSel.addEventListener('change', ()=>{ state.blogFreq = blogFreqSel.value; saveDraft(); });

  const tagInput = document.getElementById('tagInput');
  const addTagBtn = document.getElementById('addTag');
  if(addTagBtn){
    addTagBtn.addEventListener('click', ()=>{
      const v = tagInput.value.trim();
      if(v){ state.blogCategories.push(v); newTagBuffer=''; renderStep(); }
    });
    tagInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); addTagBtn.click(); }
      else { newTagBuffer = tagInput.value; }
    });
  }
}

async function saveDraft(){
  try{ await window.storage.set('draft', JSON.stringify(state), false); }catch(e){}
}
async function loadDraft(){
  try{
    const r = await window.storage.get('draft', false);
    if(r && r.value){ state = Object.assign(state, JSON.parse(r.value)); }
  }catch(e){}
}

async function submitBrief(){
  try{
    const key = 'submission:' + Date.now() + '_' + (state.clientName||'unnamed').replace(/[^a-zA-Z0-9]/g,'');
    await window.storage.set(key, JSON.stringify(state), true);
  }catch(e){}
  document.getElementById('content').innerHTML = `
    <div class="done-screen">
      <div class="icon">&#10003;</div>
      <h1 class="step-title">Brief submitted</h1>
      <p class="step-desc" style="margin:0 auto;">Thanks, ${state.clientName||'there'}. Your designer has everything they need to get started and will follow up to confirm next steps.</p>
    </div>
  `;
  document.getElementById('navButtons').innerHTML = '';
}

async function openAdmin(){
  const panel = document.getElementById('adminPanel');
  const list = document.getElementById('adminList');
  list.innerHTML = 'Loading...';
  panel.style.display = 'flex';
  try{
    const res = await window.storage.list('submission:', true);
    if(!res || !res.keys || res.keys.length===0){ list.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">No submissions yet.</p>'; return; }
    let out = '';
    for(const k of res.keys){
      try{
        const r = await window.storage.get(k, true);
        const data = JSON.parse(r.value);
        out += `<div class="admin-entry"><b>${data.clientName||'Unnamed'}</b> &mdash; ${data.businessDesc||''}<pre>${JSON.stringify(data,null,2)}</pre></div>`;
      }catch(e){}
    }
    list.innerHTML = out || '<p style="font-size:13px;color:var(--ink-soft);">No submissions yet.</p>';
  }catch(e){
    list.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Could not load submissions.</p>';
  }
}

document.getElementById('adminLink').addEventListener('click', openAdmin);
document.getElementById('closeAdmin').addEventListener('click', ()=>{ document.getElementById('adminPanel').style.display='none'; });

(async ()=>{
  await loadDraft();
  renderStep();
})();
</script>
</body>
</html>
