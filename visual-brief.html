<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Onboarding Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&family=Almarai:wght@300;400;700;800&family=Noto+Kufi+Arabic:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css">
<style>
:root {
  --bg:#f0f5ff; --bg3:#e2eaf8; --surface:#ffffff; --surface2:#eef2fc;
  --border:rgba(37,99,235,0.10); --border-active:rgba(37,99,235,0.38);
  --accent:#2563eb; --accent2:#60a5fa;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --love:#e05f7a; --avoid:#e07a5f;
  --mono:'IBM Plex Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;} html{scroll-behavior:smooth;}
body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;} input,textarea,button{font-family:inherit;}
.bg-orb{position:fixed;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:0.12;z-index:0;}
.bg-orb-1{width:500px;height:500px;background:#3b82f6;top:-100px;left:-150px;}
.bg-orb-2{width:400px;height:400px;background:#1d4ed8;bottom:-100px;right:-100px;}
.bg-orb-3{width:300px;height:300px;background:#7dd3fc;top:50%;left:50%;transform:translate(-50%,-50%);}
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.5s cubic-bezier(0.4,0,0.2,1);z-index:100;border-radius:0 2px 2px 0;}
.site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:rgba(240,245,255,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;letter-spacing:0.02em;color:var(--text);}
.logo span{color:var(--accent);}
.step-pills{display:flex;gap:6px;}
.step-pill{width:28px;height:6px;border-radius:3px;background:var(--surface2);transition:background 0.3s,width 0.3s;}
.step-pill.done{background:var(--accent);} .step-pill.active{background:var(--accent2);width:42px;}
.app-wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:110px 24px 100px;}
.step-card{width:100%;max-width:780px;background:rgba(255,255,255,0.95);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;box-shadow:0 4px 40px rgba(37,99,235,0.08);padding:52px 56px;position:relative;overflow:hidden;animation:fadeUp 0.45s cubic-bezier(0.4,0,0.2,1) both;}
.step-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(37,99,235,0.04) 0%,transparent 60%);pointer-events:none;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.step-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;}
.step-title{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;line-height:1.12;margin:0 0 12px;color:var(--text);letter-spacing:-0.01em;}
.step-desc{font-size:15px;color:var(--text2);line-height:1.65;margin:0 0 36px;max-width:56ch;}
.section-divider{height:1px;background:var(--border);margin:32px 0;}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin:0 0 16px;display:block;}
.field-label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin:0 0 8px;}
.field-optional{font-size:11px;color:var(--text3);font-family:var(--mono);font-weight:400;margin-left:6px;}
input[type=text],textarea{width:100%;background:#f8faff;border:1px solid var(--border);border-radius:8px;padding:11px 16px;font-size:14px;color:var(--text);line-height:1.5;transition:border-color 0.2s,box-shadow 0.2s;outline:none;resize:vertical;}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.18);}
input[type=text]::placeholder,textarea::placeholder{color:var(--text3);}
textarea{min-height:90px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
.chip{border:1px solid var(--border-active);background:#eef2fc;border-radius:999px;padding:7px 18px;font-size:13px;color:var(--text2);transition:all 0.18s ease;}
.chip:hover{border-color:var(--accent);color:var(--text);}
.chip.selected{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0d0d0f;font-weight:600;}
/* Palette */
.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-bottom:20px;}
.palette-slot{background:#f8faff;border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.palette-slot-label{font-size:12px;font-weight:500;color:var(--text2);}
.color-preview-row{display:flex;gap:8px;align-items:center;}
.color-swatch{width:40px;height:40px;border-radius:8px;border:2px solid rgba(255,255,255,0.12);cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;flex-shrink:0;}
.color-swatch:hover{transform:scale(1.08);box-shadow:0 0 0 3px rgba(37,99,235,0.4);}
.color-hex-input{flex:1;font-family:var(--mono);font-size:13px;background:#f8faff;border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);min-width:0;width:auto;}
.saved-palettes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;min-height:32px;}
.saved-palette{display:flex;gap:4px;padding:6px 10px;background:#eef2fc;border-radius:8px;border:1px solid var(--border);align-items:center;}
.swatch-mini{width:16px;height:16px;border-radius:4px;}
.label-mini{font-size:11px;color:var(--text2);margin-left:6px;}
.save-palette-btn{border:1px dashed var(--border-active);background:none;border-radius:8px;padding:9px 18px;font-size:13px;color:var(--text2);transition:all 0.18s;cursor:pointer;margin-top:10px;}
.save-palette-btn:hover{border-color:var(--accent);color:var(--accent);}
/* Fonts */
.font-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
@media(max-width:560px){.font-grid{grid-template-columns:1fr;}}
.font-card{background:#f8faff;border:1.5px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;gap:8px;text-align:left;}
.font-card:hover{border-color:rgba(37,99,235,0.5);background:var(--surface2);}
.font-card.selected{border-color:var(--accent);background:rgba(37,99,235,0.06);box-shadow:0 0 0 1px var(--accent);}
.fc-name{font-size:11px;font-weight:600;color:var(--accent);font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase;}
.fc-sample{font-size:26px;color:var(--text);line-height:1.2;}
.fc-sample-ar{font-size:24px;color:var(--text);line-height:1.4;text-align:right;direction:rtl;}
.fc-desc{font-size:11px;color:var(--text3);line-height:1.5;}
.fc-tag{display:inline-block;background:#dbeafe;border-radius:4px;padding:2px 7px;font-size:10px;color:var(--text3);font-family:var(--mono);}
/* Style */
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:24px;}
.style-card{background:#ffffff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all 0.2s;}
.style-card:hover{border-color:rgba(37,99,235,0.5);transform:translateY(-2px);}
.style-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 20px rgba(37,99,235,0.18);}
.sc-visual{height:90px;display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:-2px;}
.sc-vis-elegant{background:linear-gradient(135deg,#1a1208,#2d1e0a,#3b2710);}
.sc-vis-bold{background:linear-gradient(135deg,#0a0a0a,#111,#1a0000);}
.sc-vis-soft{background:linear-gradient(135deg,#f5f0eb,#ede4d9,#ddd0c1);}
.sc-vis-minimal{background:linear-gradient(135deg,#f9f9f9,#efefef,#e5e5e5);}
.sc-vis-playful{background:linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1);}
.sc-vis-corporate{background:linear-gradient(135deg,#0f2040,#1a3060,#243070);}
.sc-vis-earthy{background:linear-gradient(135deg,#3d2b1f,#5c3d2e,#7a5040);}
.sc-vis-luxe{background:linear-gradient(135deg,#1c1208,#2d1e08,rgba(37,99,235,0.27));}
.sc-body{padding:12px;}
.sc-title{font-size:13px;font-weight:600;color:#0f172a;}
.sc-desc{font-size:11px;color:#64748b;margin-top:3px;line-height:1.4;}
/* Slider */
.slider-wrap{margin-bottom:24px;}
.range-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:6px;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#dbeafe;outline:none;margin:0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);box-shadow:0 2px 8px rgba(37,99,235,0.4);}
/* Gallery */
.gallery-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px;}
.gallery-grid{display:flex;flex-direction:column;gap:24px;margin-bottom:28px;}
.gallery-img-full{width:100%;display:block;border-radius:10px 10px 0 0;object-fit:contain;max-height:480px;background:#0a0a0a;}
.img-card{background:#ffffff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color 0.2s,transform 0.2s;}
.img-card:hover{transform:translateY(-2px);}
.img-card.label-love{border-color:var(--love);box-shadow:0 0 0 1px var(--love),0 4px 20px rgba(224,95,122,0.2);}
.img-card.label-avoid{border-color:var(--avoid);box-shadow:0 0 0 1px var(--avoid),0 4px 20px rgba(224,122,95,0.2);}
.img-card.label-inspire{border-color:#2563eb;box-shadow:0 0 0 1px #2563eb,0 4px 20px rgba(37,99,235,0.2);}
.img-card.label-meh{border-color:var(--text3);}
.img-placeholder{width:100%;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;font-family:var(--mono);text-align:center;padding:16px;min-height:155px;position:relative;}
.img-ph-dark{background:linear-gradient(135deg,#0d0d0f 0%,#1a1a2e 100%);color:#6a6460;}
.img-ph-dark2{background:linear-gradient(135deg,#12100e 0%,#3a1e14 100%);color:#6a6460;}
.img-ph-light{background:linear-gradient(135deg,#f0ece4 0%,#ddd8d0 100%);color:#a09a90;}
.img-ph-light2{background:linear-gradient(135deg,#faf6f0 0%,#e8ddd0 100%);color:#a09a90;}
.img-ph-bold{background:linear-gradient(135deg,#1a0000 0%,#3a0010 100%);color:#6a6460;}
.img-ph-bold2{background:linear-gradient(135deg,#0a0010 0%,#1e003a 100%);color:#6a6460;}
.img-ph-nature{background:linear-gradient(135deg,#0f1a0f 0%,#1a3020 100%);color:#6a6460;}
.img-ph-nature2{background:linear-gradient(135deg,#1a1208 0%,#3a2e1a 100%);color:#6a6460;}
.ph-icon{font-size:30px;opacity:0.6;}
.ph-label{font-size:10px;opacity:0.6;letter-spacing:0.06em;text-transform:uppercase;line-height:1.6;}
.ph-num{font-size:9px;opacity:0.35;position:absolute;top:8px;left:10px;font-family:var(--mono);}
.img-card-body{padding:12px 14px 14px;}
.img-card-site-label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px;}
.img-card-style-tag{display:inline-block;font-size:10px;color:var(--text3);background:#e2eaf8;border-radius:4px;padding:2px 7px;font-family:var(--mono);margin-bottom:8px;}
.img-label-row{display:flex;gap:5px;margin-bottom:8px;}
.img-label-btn{flex:1;border:1px solid var(--border-active);background:#f0f5ff;border-radius:6px;padding:5px 2px;font-size:10px;color:var(--text2);transition:all 0.15s;text-align:center;}
.img-label-btn:hover{border-color:var(--accent);color:var(--text);}
.img-label-btn.active-love{background:var(--love);border-color:var(--love);color:#fff;}
.img-label-btn.active-avoid{background:var(--avoid);border-color:var(--avoid);color:#fff;}
.img-label-btn.active-inspire{background:#5b8df5;border-color:#5b8df5;color:#fff;}
.img-label-btn.active-meh{background:#e2eaf8;border-color:var(--text3);color:var(--text2);}
.img-comment{width:100%;font-size:12px;background:#f0f5ff;border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);resize:none;min-height:50px;outline:none;}
.img-comment:focus{border-color:var(--accent);}
.img-comment::placeholder{color:var(--text3);}
/* Nav */
.nav-buttons{width:100%;max-width:780px;display:flex;justify-content:space-between;align-items:center;margin-top:24px;}
.btn{font-size:14px;font-weight:600;padding:13px 30px;border-radius:10px;border:none;transition:all 0.2s;letter-spacing:0.02em;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d0d0f;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(37,99,235,0.3);}
.btn-ghost{background:#eef2fc;border:1px solid var(--border-active);color:var(--text2);}
.btn-ghost:hover{border-color:var(--accent);color:var(--text);}
.btn-skip{background:none;border:none;color:var(--text3);font-size:13px;padding:13px 10px;text-decoration:underline;text-decoration-color:transparent;transition:color 0.2s,text-decoration-color 0.2s;}
.btn-skip:hover{color:var(--text2);text-decoration-color:var(--text3);}
/* Thank you */
.thankyou-wrap{text-align:center;padding:16px 0 40px;}
.ty-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 28px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;}
@keyframes popIn{from{opacity:0;transform:scale(0.4);}to{opacity:1;transform:scale(1);}}
.ty-title{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:700;margin:0 0 16px;background:linear-gradient(135deg,#0f172a 40%,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ty-subtitle{font-size:16px;color:var(--text2);max-width:48ch;margin:0 auto 36px;line-height:1.65;}
.reminder-cards{display:flex;flex-direction:column;gap:14px;max-width:500px;margin:0 auto;}
.reminder-card{background:#f8faff;border:1px solid var(--border);border-radius:14px;padding:20px 24px;text-align:left;display:flex;gap:16px;align-items:flex-start;}
.reminder-card.highlight{border-color:var(--accent);background:rgba(37,99,235,0.06);}
.rc-icon{font-size:24px;flex-shrink:0;margin-top:2px;}
.rc-title{font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px;}
.rc-desc{font-size:13px;color:var(--text2);line-height:1.55;}
/* Misc */
.step-badge{display:block;width:100%;background:var(--accent);color:#ffffff;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:10px 0;text-align:center;margin:-52px -56px 36px;width:calc(100% + 112px);border-radius:24px 24px 0 0;}
.save-palette-btn-new{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:12px;letter-spacing:0.02em;}
.save-palette-btn-new:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,0.35);}
.save-palette-btn-new svg{width:15px;height:15px;flex-shrink:0;}
@media(max-width:640px){.step-card{padding:32px 24px;}.step-title{font-size:28px;}.site-header{padding:14px 20px;}.step-badge{margin:-32px -24px 28px;width:calc(100% + 48px);}}
.sc-visual-img{height:90px;overflow:hidden;}
.sc-visual-img img{width:100%;height:100%;object-fit:cover;display:block;}
.formality-value{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;text-align:center;margin-bottom:6px;}
.formality-mood{font-size:13px;color:var(--text2);text-align:center;margin-top:4px;font-style:italic;}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div id="progress-bar" style="width:0%"></div>
<header class="site-header">
  <div class="logo">Website <span>Brief</span></div>
  <div class="step-pills" id="stepPills"></div>
</header>
<div class="app-wrap">
  <div class="step-card" id="stepCard">
    <div id="stepContent"></div>
  </div>
  <div class="nav-buttons" id="navButtons"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.es5.min.js"></script>

var STYLES=[

  {id:'bold',label:'Bold',desc:'Strong, high contrast',vis:'sc-vis-bold',icon:'\u25fc \u25fc \u25fc'},

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tog(arr,v){var i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v);}
function save(){try{localStorage.setItem('vsb_sf2',JSON.stringify(state));}catch(e){}}
function load(){try{var s=localStorage.getItem('vsb_sf2');if(s){var p=JSON.parse(s);Object.keys(p).forEach(function(k){state[k]=p[k];});}}catch(e){}}
function killPickrs(){pickrs.forEach(function(p){try{p.destroyAndRemove();}catch(e){}});pickrs=[];}
function renderHeader(){
  var pills=document.getElementById('stepPills');
  var h='';for(var i=0;i<TOTAL;i++){var c=i<cur?'done':(i===cur?'active':'');h+='<div class="step-pill '+c+'"></div>';}
  pills.innerHTML=h;
  document.getElementById('progress-bar').style.width=Math.round((cur/(TOTAL-1))*100)+'%';
}
function renderNav(first,last,skip){
  var nav=document.getElementById('navButtons');
  var back=first?'<span></span>':'<button class="btn btn-ghost" id="bBack">Back</button>';
  var nxt=last?'<button class="btn btn-primary" id="bNext">Submit Brief</button>':'<button class="btn btn-primary" id="bNext">Continue</button>';
  nav.innerHTML=back+'<span></span>'+nxt;
  if(!first)document.getElementById('bBack').onclick=function(){killPickrs();cur--;go();};
  document.getElementById('bNext').onclick=function(){save();if(last){done();return;}killPickrs();cur++;go();};
}
function go(){renderHeader();var card=document.getElementById('stepCard');card.style.animation='none';void card.offsetWidth;card.style.animation='';[step0,step1,step2,step3,step4,step5][cur]();window.scrollTo({top:0,behavior:'smooth'});}

  var cList = state.colors.map(function(c){return c.role+": "+c.hex+(c.note?" ("+c.note+")":"");}).join(", ");
  var iList = [];
  Object.keys(state.imgLabels).forEach(function(k){
     if(state.imgLabels[k].label || state.imgLabels[k].comment){
       iList.push("Image "+k+": "+(state.imgLabels[k].label||"none")+(state.imgLabels[k].comment?" ("+state.imgLabels[k].comment+")":""));
     }
  });
  
  var cleanData = {
    "1. Color Palette": cList,
    "2. English Font": state.enFont || "None selected",
    "3. Arabic Font": state.arFont || "None selected",
    "4. Styles": state.styles.length ? state.styles.join(", ") : "None selected",
    "5. Formality (0=Casual, 100=Formal)": state.formalityLevel,
    "6. Image Feedback": iList.length ? iList.join("\n  ") : "No images labeled",
    "7. Primary Goal": state.websiteGoal,
    "8. Target Audience": state.targetAudience,
    "9. Unique Value": state.uniqueValue,
    "10. Competitor URLs": state.competitorUrls,
    "11. Things to Avoid": state.avoidNotes,
    "12. Must-Haves": state.musthaves,
    "13. Final Notes": state.finalNotes
  };

  fetch('https://formspree.io/f/mbgjrjpw', {
    method: 'POST',
    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
    body: JSON.stringify(cleanData)
  }).catch(function(err){ console.error(err); });

  document.getElementById('navButtons').innerHTML='';
  var summary='';
  if(state.websiteGoal)summary+='Goal: '+esc(state.websiteGoal)+'<br>';
  if(state.enFont)summary+='English font: '+esc(state.enFont)+'<br>';
  if(state.arFont)summary+='Arabic font: '+esc(state.arFont)+'<br>';
  if(state.styles.length)summary+='Style(s): '+state.styles.join(', ')+'<br>';
  var loved=Object.keys(state.imgLabels).filter(function(k){return state.imgLabels[k].label==='love';});
  if(loved.length)summary+='Loved '+loved.length+' image(s)<br>';
  var avoided=Object.keys(state.imgLabels).filter(function(k){return state.imgLabels[k].label==='avoid';});
  if(avoided.length)summary+='Avoided '+avoided.length+' image(s)<br>';
  document.getElementById('stepCard').innerHTML=
    '<div class="thankyou-wrap">'+
    '<h1 class="ty-title">Thank you!</h1>'+
    '<p class="ty-subtitle">Your visual brief has been submitted. We\'ll review every detail and get started very soon.</p>'+
    '</div>';
  document.getElementById('progress-bar').style.width='100%';
  document.getElementById('stepPills').querySelectorAll('.step-pill').forEach(function(p){p.className='step-pill done';});
  window.scrollTo({top:0,behavior:'smooth'});
}

// INIT
load();go();
</script>
